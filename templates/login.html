<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>BrainyBotz Login</title>
</head>
<body class="bg-light">
<div class="container">
<div class="row justify-content-center mt-5">
<div class="col-md-5">
<div class="card shadow border-0">
<div class="card-body p-4">
<h2 class="fw-bold">BrainyBotz CRM</h2>
<p class="text-muted">Sign in to continue</p>
<form method="post">
{% csrf_token %}
{{ form.as_p }}
<button class="btn btn-primary w-100">Login</button>
</form>
<div class="text-center my-3 text-muted">or</div>
<a class="btn btn-outline-primary w-100" href="/otp/login/">Login with Email OTP</a>
<a class="d-block text-center mt-3" href="/password/reset/">Forgot your password?</a>
{% if google_enabled %}
<form method="post" action="/accounts/google/login/" class="mt-3">
{% csrf_token %}
<button class="btn btn-outline-dark w-100">Continue with Google</button>
</form>
{% endif %}
</div></div></div></div></div>
</body></html>
