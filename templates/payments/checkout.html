{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-7">
<div class="card p-4 text-center">
<h2>Complete Fee Payment</h2>
<p class="text-muted">{{fee.fee_plan.name}}</p>
<h1 class="display-5 fw-bold">₹{{fee.pending_amount}}</h1>
<p>Student: <strong>{{student.full_name}}</strong></p>
<hr>
<button id="pay-button" class="btn btn-primary btn-lg w-100">Pay with Razorpay</button>
<a href="/fees/" class="btn btn-link mt-2">Cancel</a>
<div id="payment-status" class="mt-3"></div>
</div></div></div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const options = {
  key: "{{razorpay_key_id }}",
  amount: "{{amount_paise}}",
  currency: "INR",
  name: "BrainyBotz",
  description: "{{fee.fee_plan.name|escapejs}}",
  order_id: "{{order.id}}",
  prefill: {
    name: "{{student.full_name|escapejs}}",
    contact: "{{student.registered_contact|escapejs}}"
  },
  theme: { color: "#0d6efd" },
  handler: async function (response) {
    const status = document.getElementById("payment-status");
    status.innerHTML = '<div class="alert alert-info">Verifying payment...</div>';

    const res = await fetch("/payments/verify/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": "{{ csrf_token }}"
      },
      body: JSON.stringify(response)
    });

    const data = await res.json();
    if (data.ok) {
      window.location.href = data.redirect;
    } else {
      status.innerHTML = '<div class="alert alert-danger">' + (data.error || "Payment verification failed.") + '</div>';
    }
  },
  modal: {
    ondismiss: function () {
      document.getElementById("payment-status").innerHTML =
        '<div class="alert alert-warning">Payment window closed.</div>';
    }
  }
};

document.getElementById("pay-button").onclick = function(e) {
  const rzp = new Razorpay(options);
  rzp.on("payment.failed", function(response) {
    document.getElementById("payment-status").innerHTML =
      '<div class="alert alert-danger">Payment failed. Please try again.</div>';
  });
  rzp.open();
  e.preventDefault();
};
</script>
{% endblock %}
