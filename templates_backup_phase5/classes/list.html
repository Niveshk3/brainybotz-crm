{% extends "base.html" %}{% block content %}<h2>Classes</h2><div class="card"><div class="table-responsive"><table class="table"><thead><tr><th>Date</th><th>Batch</th><th>Trainer</th><th>Topic</th><th>Activity</th><th></th></tr></thead><tbody>{% for c in classes %}<tr><td>{{c.date}}</td><td>{{c.batch.name}}</td><td>{{c.trainer.user.get_full_name}}</td><td>{{c.topic}}</td><td>{{c.activity}}</td><td><a href="/classes/{{c.id}}/">Open</a></td></tr>{% empty %}<tr><td colspan="6">No classes.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
