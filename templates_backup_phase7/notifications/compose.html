{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h2>Send Notification</h2>
    <p class="text-muted mb-0">Send an announcement to all active students or trainers.</p>
  </div>
  <a href="/notifications/" class="btn btn-outline-secondary">Back</a>
</div>
<div class="card p-4">
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">Send Notification</button>
</form>
</div>
{% endblock %}
