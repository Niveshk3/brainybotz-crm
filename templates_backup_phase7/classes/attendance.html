{% extends "base.html" %}{% load core_tags %}{% block content %}<h2>Attendance — {{session.batch.name}}</h2><p>{{session.date}} · {{session.topic}}</p><form method="post">{% csrf_token %}<div class="card p-3"><table class="table"><thead><tr><th>Student</th><th>Status</th></tr></thead><tbody>{% for s in students %}<tr><td>{{s.full_name}}<br><small>{{s.student_id}}</small></td><td><select name="status_{{s.id}}" class="form-select"><option value="PRESENT" {% if existing|get_item:s.id == "PRESENT" %}selected{% endif %}>Present</option><option value="ABSENT" {% if existing|get_item:s.id == "ABSENT" %}selected{% endif %}>Absent</option><option value="LATE" {% if existing|get_item:s.id == "LATE" %}selected{% endif %}>Late</option><option value="LEAVE" {% if existing|get_item:s.id == "LEAVE" %}selected{% endif %}>Leave</option></select></td></tr>{% endfor %}</tbody></table><button class="btn btn-primary">Submit Attendance</button></div></form>{% endblock %}
