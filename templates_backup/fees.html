{% extends "base.html" %}{% block content %}<h2>Fees</h2><div class="card p-3"><div class="table-responsive"><table class="table"><thead><tr><th>Student</th><th>Plan</th><th>Total</th><th>Paid</th><th>Pending</th><th>Status</th></tr></thead><tbody>{% for f in fees %}<tr><td>{{f.student.full_name}}</td><td>{{f.fee_plan.name}}</td><td>₹{{f.fee_plan.amount}}</td><td>₹{{f.paid_amount}}</td><td>₹{{f.pending_amount}}</td><td>{{f.status}}</td></tr>{% empty %}<tr><td colspan="6">No fee records.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
