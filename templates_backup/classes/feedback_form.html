{% extends "base.html" %}
{% block content %}
<div class="card p-4">
  <h2>Student Feedback</h2>
  <p class="text-muted">{{student.full_name}} · {{session.topic}} · {{session.date}}</p>
  <form method="post">
    {% csrf_token %}
    {{form.as_p}}
    <button class="btn btn-primary">Save Feedback</button>
    <a href="/classes/{{session.id}}/" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
