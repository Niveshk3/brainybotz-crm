{% extends "base.html" %}{% block content %}<h2>BrainyBotz Community</h2><div class="row g-3">{% for p in posts %}<div class="col-md-6"><div class="card p-4"><span class="badge bg-primary mb-2">{{p.get_post_type_display}}</span><h5>{{p.title}}</h5><p>{{p.content}}</p>{% if p.event_date %}<small>Event: {{p.event_date}}</small>{% endif %}</div></div>{% empty %}<p>No community posts.</p>{% endfor %}</div>{% endblock %}
