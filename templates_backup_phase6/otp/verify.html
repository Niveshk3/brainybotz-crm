{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-6 col-lg-5">
<div class="card p-4">
<h2>Verify OTP</h2>
<p class="text-muted">Enter the 6-digit code sent to <strong>{{email}}</strong>.</p>
<form method="post">
{% csrf_token %}
{{form.as_p}}
<button class="btn btn-primary w-100">Verify & Login</button>
</form>
<a href="/otp/login/" class="btn btn-link w-100 mt-2">Use another email</a>
</div></div></div>
{% endblock %}
