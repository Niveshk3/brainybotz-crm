{% extends "base.html" %}{% block content %}<h2>Certificates & Achievements</h2><div class="row g-3">{% for c in certificates %}<div class="col-md-6"><div class="card p-4"><h5>{{c.title}}</h5><p>{{c.certificate_type}} · {{c.issue_date}}</p>{% if c.file %}<a href="{{c.file.url}}" target="_blank">Open Certificate</a>{% endif %}</div></div>{% empty %}<p>No certificates.</p>{% endfor %}</div>{% endblock %}
